<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colour Palette v6</title>
<style>
	* { box-sizing: border-box; }
	body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1c1c1e; background: #f6f6f4; }
	main { max-width: 1100px; margin: 0 auto; padding: 48px 24px 80px; }
	h1 { font-size: 28px; margin: 0 0 4px; }
	h2 { font-size: 20px; margin: 48px 0 4px; }
	.lead, .hint { color: #5c5c60; margin: 0 0 20px; }
	form { display: flex; gap: 8px; flex-wrap: wrap; }
	label.hidden { position: absolute; left: -9999px; }
	input { flex: 1 1 320px; font: inherit; padding: 12px 14px; border: 1px solid #c8c8cc; border-radius: 8px; background: #fff; }
	button { font: inherit; font-weight: 600; padding: 12px 20px; border: 0; border-radius: 8px; background: #1c1c1e; color: #fff; cursor: pointer; }
	button:disabled { opacity: .6; cursor: wait; }
	input:focus-visible, button:focus-visible { outline: 3px solid #2b5fd9; outline-offset: 2px; }
	.status { margin: 16px 0 0; min-height: 24px; }
	.error { color: #b3261e; }

	/* Top 5, side by side like a Coolors palette. */
	.palette { display: flex; height: 360px; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06); }
	.palette button { all: unset; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; padding: 0 8px 28px; cursor: pointer; text-align: center; transition: flex-grow .2s ease; }
	.palette button:hover { flex-grow: 1.25; }
	.palette button:focus-visible { outline: 3px solid #2b5fd9; outline-offset: -6px; }
	.palette .hex { font-size: clamp(16px, 2.4vw, 26px); font-weight: 700; letter-spacing: .02em; }
	.palette .pct { font-size: 14px; opacity: .8; }
	.palette .copy { font-size: 12px; opacity: 0; transition: opacity .15s; }
	.palette button:hover .copy, .palette button:focus-visible .copy { opacity: .8; }
	@media (prefers-reduced-motion: reduce) { .palette button, .palette .copy { transition: none; } }
	@media (max-width: 640px) { .palette { flex-direction: column; height: auto; } .palette button { padding: 22px 16px; flex-direction: row; justify-content: space-between; } }

	/* Every colour, most coverage first. */
	.list { list-style: none; margin: 0; padding: 0; background: #fff; border: 1px solid #e2e2e4; border-radius: 12px; overflow: hidden; }
	.list li + li { border-top: 1px solid #ececee; }
	.list button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 44px 84px 140px 150px 1fr 70px; align-items: center; gap: 14px; width: 100%; padding: 10px 16px; cursor: pointer; }
	.tag { justify-self: start; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: help; }
	.tag-brand { background: #fde9c8; color: #6b3d00; }
	.tag-background { background: #e8eef7; color: #1f3a5f; }
	.tag-text { background: #eeeeee; color: #3a3a3e; }
	.show { margin: 0 0 4px; }
	.list button:hover { background: #fafafa; }
	.list button:focus-visible { outline: 3px solid #2b5fd9; outline-offset: -3px; }
	.chip { width: 44px; height: 32px; border-radius: 6px; border: 1px solid rgba(0,0,0,.12); }
	.code { font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
	.rgb { color: #5c5c60; font-size: 13px; }
	.bar { height: 8px; background: #ececee; border-radius: 4px; overflow: hidden; }
	.bar span { display: block; height: 100%; background: #1c1c1e; border-radius: 4px; }
	.share { text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
	@media (max-width: 640px) { .list button { grid-template-columns: 44px 1fr auto 60px; } .list .rgb, .list .bar { display: none; } }
	/* Rank by: a two-way segmented switch. */
	.method { border: 0; padding: 0; margin: 14px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
	.method legend { float: left; font-size: 14px; color: #5c5c60; margin-right: 4px; padding: 0; }
	.method label { position: relative; }
	.method input { position: absolute; opacity: 0; }
	.method span { display: block; padding: 8px 14px; border: 1px solid #c8c8cc; border-radius: 8px; background: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
	.method input:checked + span { background: #1c1c1e; border-color: #1c1c1e; color: #fff; }
	.method input:focus-visible + span { outline: 3px solid #2b5fd9; outline-offset: 2px; }
	[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
	<h1>Colour Palette <small style="font-weight:400;color:#5c5c60">v6</small></h1>
	<p class="lead">Paste a website address to see every colour on the page, ranked by how much of the page it covers or by how often the CSS uses it. Images are left out.</p>

	<form id="form">
		<label class="hidden" for="url">Website address</label>
		<input id="url" type="text" placeholder="e.g. www.example.com" required autocomplete="url">
		<button id="go" type="submit">Get colours</button>
	</form>
	<fieldset class="method">
		<legend>Rank by</legend>
		<label><input type="radio" name="method" value="coverage" checked><span>% of page covered</span></label>
		<label><input type="radio" name="method" value="css"><span>Times used in the CSS</span></label>
	</fieldset>
	<p id="status" class="status" role="status" aria-live="polite"></p>

	<section id="results" hidden>
		<fieldset class="method show" id="show">
			<legend>Show</legend>
			<label><input type="radio" name="show" value="brand" checked><span>Brand</span></label>
			<label><input type="radio" name="show" value="background"><span>Background</span></label>
			<label><input type="radio" name="show" value="text"><span>Text</span></label>
			<label><input type="radio" name="show" value="all"><span>All</span></label>
		</fieldset>
		<h2 id="top-heading">Top 5 colours</h2>
		<p class="hint">Click a colour to copy its code. Hover a label to see why it was given.</p>
		<div id="palette" class="palette"></div>
		<p id="empty" class="hint" hidden></p>

		<h2 id="all-heading">All colours</h2>
		<p class="hint" id="measured"></p>
		<ul id="list" class="list"></ul>
	</section>
</main>

<script>
const $ = (id) => document.getElementById(id);

// Black or white text, whichever reads better on the colour (WCAG luminance).
function textFor(hex) {
	const lum = [1, 3, 5].map((i) => { const v = parseInt(hex.slice(i, i + 2), 16) / 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; })
		.reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i], 0);
	return lum > 0.179 ? '#000' : '#fff';
}
const rgb = (hex) => `rgb(${[1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)).join(', ')})`;
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
const pct = (share) => (share >= 0.001 ? `${(share * 100).toFixed(share < 0.1 ? 1 : 0)}%` : '<0.1%');

function setStatus(text, isError = false) {
	$('status').textContent = text;
	$('status').className = 'status' + (isError ? ' error' : '');
}

async function copy(hex) {
	await navigator.clipboard.writeText(hex.toUpperCase());
	setStatus(`Copied ${hex.toUpperCase()}`);
}

// Brand / Background / Text, from how the page uses each colour (see classify.mjs).
const LABEL = { brand: 'Brand', background: 'Background', text: 'Text' };
const GROUP = { brand: 'brand colours', background: 'background colours', text: 'text colours', all: 'colours' };
const labelOf = (c) => (c.asBackground ? 'Brand · background' : LABEL[c.label]);
const show = () => document.querySelector('input[name="show"]:checked').value;
let last = null;

function render(result) {
	last = result;
	const { url } = result;
	const css = result.method === 'css';
	const group = show();
	const colours = group === 'all' ? result.colours : result.colours.filter((c) => c.label === group);
	// How much of each colour there is, in the chosen ranking: page coverage, or times used in the CSS.
	const amount = (c) => (css ? c.count : c.coverage);
	const long = (c) => (css ? `used ${c.count}× in the CSS` : `${pct(c.coverage)} of the page`);
	const short = (c) => (css ? `${c.count}×` : pct(c.coverage));
	const why = (c) => esc(c.reasons.join('. ')) + '.';

	// Counts on the Show buttons, so nothing seems to vanish when a group is chosen.
	for (const input of document.querySelectorAll('input[name="show"]')) {
		const n = input.value === 'all' ? result.colours.length : result.colours.filter((c) => c.label === input.value).length;
		input.nextElementSibling.textContent = `${input.value === 'all' ? 'All' : LABEL[input.value]} (${n})`;
	}

	const n = Math.min(5, colours.length) || 5;
	$('top-heading').textContent = n === 1 ? `Top ${GROUP[group].replace(/s$/, '')}` : `Top ${n} ${GROUP[group]}`;
	$('palette').hidden = !colours.length;
	$('empty').hidden = !!colours.length;
	$('empty').textContent = group === 'brand'
		? 'No brand colours found outside images. If the brand colours only appear in the logo or photos, they can\'t be seen here (images are left out). Try All.'
		: `No ${GROUP[group]} found. Try All.`;
	$('palette').replaceChildren(...colours.slice(0, 5).map((c) => {
		const b = document.createElement('button');
		b.type = 'button';
		b.style.background = c.hex;
		b.style.color = textFor(c.hex);
		b.title = `${labelOf(c)}: ${c.reasons.join('. ')}.`;
		b.innerHTML = `<span class="hex">${c.hex.slice(1).toUpperCase()}</span><span class="pct">${long(c)}</span><span class="pct">${labelOf(c)}</span><span class="copy">Click to copy</span>`;
		b.setAttribute('aria-label', `${c.hex.toUpperCase()}, ${long(c)}, ${labelOf(c)}: ${c.reasons.join(', ')}. Copy`);
		b.addEventListener('click', () => copy(c.hex));
		return b;
	}));

	const top = amount(colours[0] ?? {}) || 1;
	$('all-heading').textContent = `${group === 'all' ? 'All colours' : `All ${GROUP[group]}`} (${colours.length})`;
	$('measured').textContent = css
		? `Counted in ${result.stylesheets.length} stylesheet${result.stylesheets.length === 1 ? '' : 's'}, <style> blocks and inline styles${result.skipped.length ? ` (${result.skipped.length} skipped, e.g. WordPress's own)` : ''}. Images are left out. Click a colour to copy it.`
		: `Measured ${result.measured.height.toLocaleString()}px of ${result.measured.pageHeight.toLocaleString()}px of page${result.measured.imagesLeftOut ? `, with ${result.measured.imagesLeftOut} images and photo backgrounds left out` : ''}. Shares are of the page outside those images. Click a colour to copy it.`;
	$('list').replaceChildren(...colours.map((c) => {
		const li = document.createElement('li');
		li.innerHTML = `<button type="button" aria-label="${c.hex.toUpperCase()}, ${long(c)}, ${labelOf(c)}: ${why(c)} Copy">
			<span class="chip" style="background:${c.hex}"></span>
			<span class="code">${c.hex.toUpperCase()}</span>
			<span class="code rgb">${rgb(c.hex)}</span>
			<span class="tag tag-${c.label}" title="${why(c)}">${labelOf(c)}</span>
			<span class="bar"><span style="width:${Math.max(0.5, (amount(c) / top) * 100)}%"></span></span>
			<span class="share">${short(c)}</span></button>`;
		li.querySelector('button').addEventListener('click', () => copy(c.hex));
		return li;
	}));
	$('results').hidden = false;
	setStatus(`Done: ${url}`);
}

const method = () => document.querySelector('input[name="method"]:checked').value;

async function load() {
	const url = $('url').value.trim();
	if (!url) return;
	$('go').disabled = true;
	setStatus(method() === 'css' ? 'Reading the site\'s CSS…' : 'Opening the page and measuring its colours… this can take up to a minute.');
	try {
		const res = await fetch(`/api/colours?url=${encodeURIComponent(url)}&method=${method()}`);
		const json = await res.json();
		if (!res.ok) throw new Error(json.error);
		render(json);
	} catch (err) {
		setStatus(err.message || 'Something went wrong. Is the Colour Palette window still open?', true);
	} finally {
		$('go').disabled = false;
	}
}

$('form').addEventListener('submit', (e) => { e.preventDefault(); load(); });
// The ranking is remembered on this computer; switching it re-ranks the same site.
const saved = localStorage.getItem('colour-palette-v6-method');
if (saved) document.querySelector(`input[name="method"][value="${saved}"]`)?.click();
for (const radio of document.querySelectorAll('input[name="method"]')) {
	radio.addEventListener('change', () => {
		localStorage.setItem('colour-palette-v6-method', method());
		if (!$('results').hidden) load();
	});
}
// Show: which group fills the palette and the list. Also remembered; re-filters without re-reading the site.
const savedShow = localStorage.getItem('colour-palette-v6-show');
if (savedShow) { const r = document.querySelector(`input[name="show"][value="${savedShow}"]`); if (r) r.checked = true; }
for (const radio of document.querySelectorAll('input[name="show"]')) {
	radio.addEventListener('change', () => {
		localStorage.setItem('colour-palette-v6-show', show());
		if (last) render(last);
	});
}
</script>
</body>
</html>
